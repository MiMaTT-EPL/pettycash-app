<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Petty Cash</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body {font-family: Arial; margin:0; background:#f4f6f8;}
.container {padding:20px;}
.card {background:white; padding:15px; margin-bottom:10px; border-radius:8px;}
input, select, button, textarea {width:100%; padding:10px; margin-top:5px;}
button {background:#16a34a; color:white; border:none;}
</style>
</head>

<body>

<div class="container" id="login">
<h2>Login</h2>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
</div>

<div class="container" id="app" style="display:none;">
<h2>Petty Cash</h2>

<div class="card">
<h3>Add Expense</h3>
<input id="exp_date" type="date">
<select id="exp_cat">
<option>Groceries</option>
<option>Transport</option>
<option>Household</option>
<option>Misc</option>
</select>
<input id="exp_shop" placeholder="Shop">
<input id="exp_amt" type="number" placeholder="Amount">
<textarea id="exp_desc" placeholder="Description"></textarea>
<button onclick="addExpense()">Save Expense</button>
</div>

<div class="card">
<h3>Add Income</h3>
<input id="inc_date" type="date">
<input id="inc_src" placeholder="Source">
<input id="inc_amt" type="number" placeholder="Amount">
<textarea id="inc_desc" placeholder="Description"></textarea>
<button onclick="addIncome()">Save Income</button>
</div>

<div class="card">
<h3>Dashboard</h3>
<p>Total Income: <span id="ti">0</span></p>
<p>Total Expenses: <span id="te">0</span></p>
<p>Balance: <span id="bal">0</span></p>
<p>Groceries: <span id="gro">0</span></p>
</div>

</div>

<script>
const SUPABASE_URL = "https://ksizgcgseobqotctbrrp.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtzaXpnY2dzZW9icW90Y3RicnJwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxNzMxOTYsImV4cCI6MjA5Mjc0OTE5Nn0.z97o7ua0wFl7tp1aB4hOBpXUPx0jcWQbgzTc0X64iP8";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function login(){
  const email=document.getElementById("email").value;
  const password=document.getElementById("password").value;
  const {error}=await supabase.auth.signInWithPassword({email,password});
  if(error){alert(error.message);} else {
    document.getElementById("login").style.display="none";
    document.getElementById("app").style.display="block";
    load();
  }
}

async function addExpense(){
  await supabase.from("petty_expenses").insert([{
    expense_date:exp_date.value,
    category:exp_cat.value,
    shop_name:exp_shop.value,
    amount:Number(exp_amt.value),
    description:exp_desc.value
  }]);
  load();
}

async function addIncome(){
  await supabase.from("petty_income").insert([{
    income_date:inc_date.value,
    source:inc_src.value,
    amount:Number(inc_amt.value),
    description:inc_desc.value
  }]);
  load();
}

async function load(){
  const {data:exp}=await supabase.from("petty_expenses").select("*");
  const {data:inc}=await supabase.from("petty_income").select("*");

  let te=exp.reduce((a,b)=>a+Number(b.amount||0),0);
  let ti=inc.reduce((a,b)=>a+Number(b.amount||0),0);
  let gro=exp.filter(x=>x.category==="Groceries").reduce((a,b)=>a+Number(b.amount||0),0);

  document.getElementById("te").innerText=te;
  document.getElementById("ti").innerText=ti;
  document.getElementById("bal").innerText=ti-te;
  document.getElementById("gro").innerText=gro;
}
</script>

</body>
</html>
